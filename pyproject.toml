[project]
name = "margin"
version = "0.0.1"
description = "Comment on a PDF in a terminal pane and have Claude Code act on each comment"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
authors = [{ name = "João Borlido" }]
dependencies = []

[project.scripts]
margin = "margin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margin"]
